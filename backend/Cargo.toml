[package]
name = "sozcuklemece-backend"
version = "0.1.0"
edition = "2024"
default-run = "sozcuklemece-backend"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
uuid = { version = "1.29.1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
