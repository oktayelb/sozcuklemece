<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sözcüklemece</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-page">
  <main class="sheet">

    <section id="landing-screen" class="screen landing">
      <h1 class="logo">Sözcüklemece</h1>
      <p class="logo-gloss"><em>isim.</em> Daha önce hiç duyulmamış bir sözcüğün anlamını üç dakikada bulma oyunu.</p>
      <div class="play-area">
        <button id="play-button" class="button button-play" type="button" hidden>Oyna</button>
        <div id="human-check" class="human-check"></div>
      </div>
      <p id="played-note" class="played-note" hidden>Bugünün sözcüğünü oynadın. Yeni sözcük yarın.</p>
      <p id="error-banner" class="error-banner" role="alert" hidden></p>
      <p id="today-date" class="today-date"></p>
    </section>

    <section id="game-screen" class="screen" hidden>
      <header class="game-header">
        <h2 id="game-word" class="headword game-word"></h2>
        <span id="timer-text" class="timer" role="timer">3:00</span>
        <div class="time-bar"><div id="time-bar-fill" class="time-bar-fill"></div></div>
      </header>

      <form id="guess-form" class="guess-form" autocomplete="off">
        <label for="guess-input" class="guess-label">Sence ne demek?</label>
        <div class="guess-row">
          <input id="guess-input" class="guess-input" type="text" maxlength="200" spellcheck="false" required>
          <button id="guess-button" class="button" type="submit">Yaz</button>
        </div>
      </form>
      <p id="guess-feedback" class="feedback" aria-live="polite"></p>

      <div id="hint-list" class="hint-list"></div>
      <ol id="guess-list" class="guess-list"></ol>
    </section>

    <section id="result-screen" class="screen result" hidden>
      <p id="result-stamp" class="stamp"></p>

      <article class="entry">
        <h2 id="result-word" class="headword"></h2>
        <p id="result-category" class="entry-line entry-category"></p>
        <p id="result-parts" class="entry-line"></p>
        <p id="result-definition" class="definition"></p>
        <p id="result-sentence" class="entry-line entry-sentence"></p>
      </article>

      <dl class="tally">
        <div class="tally-item tally-score"><dt>Puan</dt><dd id="result-score"></dd></div>
        <div class="tally-item"><dt>Süre</dt><dd id="result-time"></dd></div>
        <div class="tally-item"><dt>İpucu</dt><dd id="result-hints"></dd></div>
        <div class="tally-item"><dt>Tahmin</dt><dd id="result-guesses"></dd></div>
        <div class="tally-item"><dt>En yakın</dt><dd id="result-closeness"></dd></div>
      </dl>

      <button id="home-button" class="button" type="button">Ana sayfaya dön</button>
    </section>

  </main>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script src="app.js"></script>
</body>
</html>
